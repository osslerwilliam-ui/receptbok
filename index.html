<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receptbok</title>
<meta name="description" content="Personlig receptbok som fungerar offline.">
<meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)">
<script>
  // Valt färgläge (se js/theme.js) sätts innan sidan ritas, så att den inte blinkar.
  try {
    var t = localStorage.getItem('receptbok-tema');
    if (t === 'light' || t === 'dark') {
      document.documentElement.dataset.theme = t;
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#1c1714' : '#f5efe4'; });
    }
  } catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/db.js">
<link rel="modulepreload" href="js/migrate.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/router.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/icons.js">
<link rel="modulepreload" href="js/format.js">
<link rel="modulepreload" href="js/search.js">
<link rel="modulepreload" href="js/components.js">
<link rel="modulepreload" href="js/views/home.js">
<script type="module" src="js/app.js"></script>
<script>
  // Nödläge: om appen inte har startat efter några sekunder visas en hjälpruta.
  // "Reparera" tar bort appens sparade programfiler (inte recepten) och laddar om.
  setTimeout(function () {
    if (document.documentElement.dataset.booted || (document.getElementById('app') || {}).children?.length) return;
    var box = document.createElement('div');
    box.className = 'rescue';
    box.innerHTML = '<h1>Receptboken startar inte</h1>' +
      '<p>Dina recept finns kvar i telefonen. Prova i den här ordningen:</p>' +
      '<p>1. Stäng alla andra fönster och Chrome-flikar med Receptbok och tryck <b>Ladda om</b>.</p>' +
      '<p>2. Hjälper inte det: tryck <b>Reparera appen</b>. Appens programfiler hämtas på nytt – recepten påverkas inte. Kräver internet.</p>' +
      '<button type="button" id="rescue-reload">Ladda om</button>' +
      '<button type="button" id="rescue-repair">Reparera appen</button>';
    document.body.appendChild(box);
    document.getElementById('rescue-reload').onclick = function () { location.reload(); };
    document.getElementById('rescue-repair').onclick = async function () {
      this.disabled = true;
      this.textContent = 'Reparerar…';
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var r of regs) await r.unregister();
        var keys = await caches.keys();
        for (var k of keys) if (k.indexOf('receptbok-') === 0) await caches.delete(k);
        // Installera service workern på nytt: den hämtar alla filer med nya adresser (?v=…),
        // så inga gamla kopior följer med. Vänta tills den är klar och ladda sedan om.
        var reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
        await new Promise(function (done) {
          var w = reg.installing || reg.waiting || reg.active;
          if (!w || w.state === 'activated') return done();
          w.addEventListener('statechange', function () { if (w.state === 'activated' || w.state === 'redundant') done(); });
          setTimeout(done, 20000);
        });
      } catch (e) {}
      location.reload();
    };
  }, 6000);
</script>
</head>
<body>
<div id="app" class="app"></div>
<noscript><p style="padding:16px">Receptbok behöver JavaScript för att fungera.</p></noscript>
</body>
</html>
